services:
  postgres:
    image: postgres:18
    container_name: myapp_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myapp_db}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---encoding=UTF8}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ServiceDataBase/init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-myapp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  redis:
    image: redis:7
    container_name: rag_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ragprogramm_redis_data:/data
    restart: unless-stopped
    networks:
      - rag_network

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_NOTIFY_WEBHOOK_ENABLE_1: ${MINIO_NOTIFY_WEBHOOK_ENABLE_1:-on}
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_1: ${MINIO_NOTIFY_WEBHOOK_ENDPOINT_1:-http://rag_service:8001/documents/ingest/webhook}
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_1: ${MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_1:-my_token}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - rag_network
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin}) do
        echo 'Waiting for MinIO...' && sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_KNOWLEDGE_BASE:-knowledge-base};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_USERS:-users};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_PROJECTS:-projects};
      /usr/bin/mc event add myminio/${MINIO_BUCKET_KNOWLEDGE_BASE:-knowledge-base} arn:minio:sqs::1:webhook --event put;
      echo 'MinIO buckets and webhook configured successfully!';
      "

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - rag_network

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:turing-1.8
    container_name: rag_tei
    environment:
      MODEL_ID: ${EMBEDDING_MODEL_NAME:-intfloat/multilingual-e5-large}
      DTYPE: float16
      PAYLOAD_LIMIT: "10000000"
    volumes:
      - hf_cache:/data
    ports:
      - "${TEI_PORT:-8085}:80"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    networks:
      - rag_network

  rag-service:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
    container_name: rag_service
    env_file:
      - .env
    volumes:
      - ./rag_service:/app/rag_service
      # Сохраняем кэш ONNX-моделей (FastEmbed)
      - fastembed_cache:/root/.cache/fastembed
    command: uvicorn rag_service.main:app --host 0.0.0.0 --port 8001 --reload
    restart: unless-stopped
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "service=rag_service"
        mode: non-blocking
        max-buffer-size: 4m
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      tei:
        condition: service_healthy
    networks:
      - rag_network

  rag-worker:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
    container_name: rag_worker
    env_file:
      - .env
    volumes:
      - ./rag_service:/app/rag_service
      # Сохраняем кэш ONNX-моделей (FastEmbed)
      - fastembed_cache:/root/.cache/fastembed
    command: celery -A rag_service.celery_app worker -l INFO
    restart: unless-stopped
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "service=rag_worker"
        mode: non-blocking
        max-buffer-size: 4m
    # Docling (layout/table/OCR-модели) считает на GPU внутри этого воркера —
    # физически тот же GTX 1660 Ti, что и у tei, GPU шарится между контейнерами
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      tei:
        condition: service_healthy
  # Именованные волюмы для кэширования тяжелых весов нейросетей
    networks:
      - rag_network

  nginx:
    image: nginx:1.25-alpine
    container_name: rag_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks:
      - rag_network

  flower:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
    container_name: rag_flower
    env_file:
      - .env
    environment:
      # Веб-UI и так без пароля (dev-стенд) — этот флаг открывает только REST API,
      # который backend/api/admin_routes.py проксирует для вкладки задач в админке.
      FLOWER_UNAUTHENTICATED_API: "true"
    command: celery --broker=${REDIS_URL:-redis://redis:6379/0} flower --port=5555
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_started
      rag-worker:
        condition: service_started
    networks:
      - rag_network
    restart: unless-stopped

  llm-service:
    build:
      context: .
      dockerfile: llm_service/Dockerfile
    container_name: llm_service
    env_file:
      - .env
    volumes:
      - ./llm_service:/app/llm_service
    command: uvicorn llm_service.main:app --host 0.0.0.0 --port 8002
    restart: unless-stopped
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "service=llm_service"
        mode: non-blocking
        max-buffer-size: 4m
    depends_on:
      rag-service:
        condition: service_started
    networks:
      - rag_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag_backend
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./ServiceDataBase:/app/ServiceDataBase
    restart: unless-stopped
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "service=backend"
        mode: non-blocking
        max-buffer-size: 4m
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_started
      llm-service:
        condition: service_started
    networks:
      - rag_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    networks:
      - rag_network

networks:
  rag_network:
    name: rag_network

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
  hf_cache:
  fastembed_cache:
  ragprogramm_redis_data:
    external: true