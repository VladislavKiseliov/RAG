services:
  postgres:
    image: postgres:16
    container_name: myapp_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myapp_db}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---encoding=UTF8}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ServiceDataBase/init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-myapp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  redis:
    image: redis:7
    container_name: rag_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ragprogramm_redis_data:/data
    restart: unless-stopped
    networks:
      - rag_network

  minio:
    image: minio/minio:latest
    container_name: rag_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - rag_network

  rag-service:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
    container_name: rag_service
    env_file:
      - rag_service/.env
    volumes:
      - ./rag_service:/app/rag_service
    command: uvicorn rag_service.main:app --host 0.0.0.0 --port 8001
    ports:
      - "${RAG_SERVICE_PORT:-8001}:8001"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - rag_network

  rag-worker:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
    container_name: rag_worker
    env_file:
      - rag_service/.env
    volumes:
      - ./rag_service:/app/rag_service
    command: celery -A rag_service.celery_app worker -l INFO
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - rag_network

  llm-service:
    build:
      context: .
      dockerfile: llm_service/Dockerfile
    container_name: llm_service
    env_file:
      - llm_service/.env
    environment:
      RAG_SERVICE_URL: ${RAG_SERVICE_URL_DOCKER:-http://rag-service:8001}
    volumes:
      - ./llm_service:/app/llm_service
    command: uvicorn llm_service.main:app --host 0.0.0.0 --port 8002
    ports:
      - "${LLM_SERVICE_PORT:-8002}:8002"
    restart: unless-stopped
    depends_on:
      rag-service:
        condition: service_started
    networks:
      - rag_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag_backend
    env_file:
      - .env
    environment:
      RAG_SERVICE_URL: ${RAG_SERVICE_URL_DOCKER:-http://rag-service:8001}
      LLM_SERVICE_URL: ${LLM_SERVICE_URL_DOCKER:-http://llm-service:8002}
    volumes:
      - ./backend:/app/backend
      - ./ServiceDataBase:/app/ServiceDataBase
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_started
      llm-service:
        condition: service_started
    networks:
      - rag_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    networks:
      - rag_network

networks:
  rag_network:
    name: rag_network

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
  ragprogramm_redis_data:
    external: true
