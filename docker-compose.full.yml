services:
  postgres:
    image: postgres:16
    container_name: myapp_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myapp_db}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---encoding=UTF8}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ServiceDataBase/init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-myapp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  redis:
    image: redis:7
    container_name: rag_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ragprogramm_redis_data:/data
    restart: unless-stopped
    networks:
      - rag_network


  minio:
      image: minio/minio:latest
      container_name: minio
      command: server /data --console-address ":9001"
      environment:
        MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
        MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
        MINIO_NOTIFY_WEBHOOK_ENABLE_1: ${MINIO_NOTIFY_WEBHOOK_ENABLE_1:-on}
        MINIO_NOTIFY_WEBHOOK_ENDPOINT_1: ${MINIO_NOTIFY_WEBHOOK_ENDPOINT_1:-http://host.docker.internal:8001/documents/ingest/webhook}
        MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_1: ${MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_1:-my_token}
      ports:
        - "${MINIO_PORT:-9000}:9000"
        - "${MINIO_CONSOLE_PORT:-9001}:9001"
      volumes:
        - minio_data:/data
      restart: unless-stopped
      healthcheck:
        test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
        - rag_network

  minio-init:
      image: minio/mc
      depends_on:
        minio:
          condition: service_healthy # Ждем именно прохождения хелсчека
      networks:
        - rag_network
      entrypoint: >
        /bin/sh -c "
        until (/usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin}) do 
          echo 'Waiting for MinIO...' && sleep 2; 
        done;

        /usr/bin/mc mb --ignore-existing myminio/documents;

        # Привязка события (важно: имя после arn должно совпадать с индексом notify_webhook)
        /usr/bin/mc event add myminio/documents arn:minio:sqs::1:webhook --event put;

        echo 'MinIO Webhook configured successfully!';
        "

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - rag_network

  rag-service:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
    container_name: rag_service
    env_file:
      - rag_service/.env
    volumes:
      - ./rag_service:/app/rag_service
    command: uvicorn rag_service.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "${RAG_SERVICE_PORT:-8001}:8001"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - rag_network

  rag-worker:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
    container_name: rag_worker
    env_file:
      - rag_service/.env
    volumes:
      - ./rag_service:/app/rag_service
    command: celery -A rag_service.celery_app worker -l INFO
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - rag_network

  flower:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
    container_name: rag_flower
    env_file:
      - rag_service/.env
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_started
      rag-worker:
        condition: service_started
    networks:
      - rag_network
    restart: unless-stopped


  llm-service:
    build:
      context: .
      dockerfile: llm_service/Dockerfile
    container_name: llm_service
    env_file:
      - llm_service/.env
    environment:
      RAG_SERVICE_URL: ${RAG_SERVICE_URL_DOCKER:-http://rag-service:8001}
    volumes:
      - ./llm_service:/app/llm_service
    command: uvicorn llm_service.main:app --host 0.0.0.0 --port 8002
    ports:
      - "${LLM_SERVICE_PORT:-8002}:8002"
    restart: unless-stopped
    depends_on:
      rag-service:
        condition: service_started
    networks:
      - rag_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag_backend
    env_file:
      - backend/.env
    environment:
      RAG_SERVICE_URL: ${RAG_SERVICE_URL_DOCKER:-http://rag-service:8001}
      LLM_SERVICE_URL: ${LLM_SERVICE_URL_DOCKER:-http://llm-service:8002}
    volumes:
      - ./backend:/app/backend
      - ./ServiceDataBase:/app/ServiceDataBase
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_started
      llm-service:
        condition: service_started
    networks:
      - rag_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    networks:
      - rag_network

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: rag_admin_panel
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
    volumes:
      - ./admin-panel:/app
      - /app/node_modules
    ports:
      - "${ADMIN_PANEL_PORT:-5174}:5174"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    networks:
      - rag_network

networks:
  rag_network:
    name: rag_network

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
  ragprogramm_redis_data:
    external: true
