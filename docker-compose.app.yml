services:
  postgres:
    image: postgres:16
    container_name: myapp_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myapp_db}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---encoding=UTF8}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ServiceDataBase/init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-myapp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network


  minio:
    image: minio/minio:latest
    container_name: rag_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"        # API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web UI
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg2://myuser:mypassword@postgres:5432/myapp_db}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL_DOCKER:-http://rag-service:8001}
      QDRANT_URL: ${QDRANT_URL_DOCKER:-http://qdrant:6333}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_started
    networks:
      - rag_network

  rag-service:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
    container_name: rag_service
    env_file:
      - .env
    environment:
      RAG_DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://myuser:mypassword@postgres:5432/myapp_db}
      QDRANT_URL: ${QDRANT_URL_DOCKER:-http://qdrant:6333}
      COLLECTION_NAME: ${COLLECTION_NAME:-rag_documents_collection}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      HF_TOKEN: ${HF_TOKEN}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379/0}
      MINIO_URL: ${MINIO_URL_DOCKER:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-rag-documents}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    command: uvicorn rag_service.main:app --host 0.0.0.0 --port 8001
    ports:
      - "${RAG_SERVICE_PORT:-8001}:8001"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - rag_network

  rag-worker:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
    container_name: rag_worker
    env_file:
      - .env
    environment:
      RAG_DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://myuser:mypassword@postgres:5432/myapp_db}
      QDRANT_URL: ${QDRANT_URL_DOCKER:-http://qdrant:6333}
      COLLECTION_NAME: ${COLLECTION_NAME:-rag_documents_collection}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      HF_TOKEN: ${HF_TOKEN}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379/0}
      MINIO_URL: ${MINIO_URL_DOCKER:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-rag-documents}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    command: celery -A rag_service.celery_app worker -l INFO
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - rag_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    networks:
      - rag_network

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: rag_admin_panel
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
    volumes:
      - ./admin-panel:/app
      - /app/node_modules
    ports:
      - "${ADMIN_PANEL_PORT:-5174}:5174"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    networks:
      - rag_network

networks:
  rag_network:
    external: true
    name: rag_network

volumes:
  postgres_data:
  minio_data:
