<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chat Pro</title>
    <style>
        :root {
            --primary-color: #5d5dff;
            --hover-color: #4a4acc;
            --bg-color: #f0f2f5;
            --sidebar-bg: #1e1e2d;
            --chat-bg: #fff;
            --user-msg-bg: #5d5dff;
            --assistant-msg-bg: #e5e5ea;
            --text-light: #fff;
            --text-dark: #000;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-dark);
        }
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            padding: 15px;
        }
        .sidebar-header {
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        .new-chat-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid #777;
            border-radius: 8px;
            background: transparent;
            color: var(--text-light);
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
        }
        .new-chat-btn:hover { background-color: #333; }
        .chat-list {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .chat-list-item {
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-list-item:hover, .chat-list-item.active {
            background-color: #3a3a50;
        }
        .main-chat {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
        }
        .chat-history {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* --- Обновлённые стили для сообщений --- */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 75%; /* Ограничение ширины сообщения */
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
            word-wrap: break-word; /* Перенос длинных слов */
        }
        .user-message {
            align-self: flex-end; /* Выравнивание сообщений пользователя справа */
            background-color: var(--user-msg-bg);
            color: var(--text-light);
            border-bottom-right-radius: 4px; /* Скругление угла */
        }
        .assistant-message {
            align-self: flex-start; /* Выравнивание сообщений ассистента слева */
            background-color: var(--assistant-msg-bg);
            color: var(--text-dark);
            border-bottom-left-radius: 4px; /* Скругление угла */
        }

        /* --- Обновлённые стили для поля ввода --- */
        .chat-input-container {
            display: flex;
            align-items: flex-end; /* Выравнивание элементов по нижнему краю */
            padding: 15px 20px;
            border-top: 1px solid #ddd;
            background-color: #fff;
            position: relative;
        }
        #messageInput {
            flex-grow: 1;
            padding: 12px 15px;
            border-radius: 20px;
            border: 1px solid #ccc;
            font-size: 1rem;
            resize: none; /* Запрет на изменение размера вручную */
            min-height: 48px; /* Минимальная высота, чтобы выглядело как большое поле */
            max-height: 200px; /* Максимальная высота, чтобы избежать переполнения */
            overflow-y: auto;
        }
        #sendButton {
            width: 48px;
            height: 48px;
            margin-left: 10px;
            border-radius: 50%; /* Круглая кнопка */
            border: none;
            background-color: var(--primary-color);
            color: var(--text-light);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
        }
        #sendButton:hover {
            background-color: var(--hover-color);
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" id="newChatBtn">+ Новый чат</button>
        </div>
        <div class="chat-list" id="chatList">
            </div>
    </nav>

    <main class="main-chat">
        <div class="chat-container">
            <div class="chat-history" id="chatHistory">
                </div>
            <div class="chat-input-container">
                <textarea id="messageInput" placeholder="Напишите сообщение..." rows="1" autofocus></textarea>
                <button id="sendButton">
                    <span>&#x27A4;</span>
                </button>
            </div>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
    const chatHistory = document.getElementById('chatHistory');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const newChatBtn = document.getElementById('newChatBtn');
    const chatList = document.getElementById('chatList');

    let currentConversationId = null;

    // Функция для автоматического изменения высоты поля ввода
    function adjustTextareaHeight() {
        messageInput.style.height = 'auto'; // Сброс высоты для вычисления
        messageInput.style.height = messageInput.scrollHeight + 'px';
    }

    // Добавляем слушатель события на ввод
    messageInput.addEventListener('input', adjustTextareaHeight);

    // Функция добавления сообщения в DOM
    function addMessage(text, role) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', `${role}-message`);

        // Создаем элемент для текста, чтобы правильно отображались переносы
        const textContent = document.createElement('span');
        textContent.innerText = text; // Используем innerText для сохранения переносов строк
        messageDiv.appendChild(textContent);

        chatHistory.appendChild(messageDiv);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    // Очистка окна чата
    function clearChatWindow() {
        chatHistory.innerHTML = '';
    }

    // Загрузка списка диалогов в сайдбар
    async function loadConversations() {
        try {
            const response = await fetch('/api/conversations');
            const data = await response.json();
            chatList.innerHTML = '';
            data.conversations.forEach(conv => {
                const div = document.createElement('div');
                div.classList.add('chat-list-item');
                div.textContent = conv.title;
                div.dataset.id = conv.id;
                div.addEventListener('click', () => selectConversation(conv.id));
                chatList.appendChild(div);
            });
        } catch (error) {
            console.error('Ошибка загрузки диалогов:', error);
        }
    }

    // Выбор и загрузка конкретного диалога
    async function selectConversation(id) {
        currentConversationId = id;
        clearChatWindow();

        document.querySelectorAll('.chat-list-item').forEach(item => {
            item.classList.toggle('active', item.dataset.id === id);
        });

        try {
            const response = await fetch(`/api/conversations/${id}`);
            const data = await response.json();
            data.history.forEach(msg => addMessage(msg.content, msg.role));
        } catch (error) {
            console.error('Ошибка загрузки истории:', error);
        }
    }

    // Создание нового чата
    async function createNewChat() {
        try {
            const response = await fetch('/api/conversations', { method: 'POST' });
            const data = await response.json();
            currentConversationId = data.conversation_id;
            clearChatWindow();
            await loadConversations();
            document.querySelector(`.chat-list-item[data-id='${currentConversationId}']`).classList.add('active');
        } catch (error) {
            console.error('Ошибка создания чата:', error);
        }
    }

    // Отправка сообщения
    async function sendMessage() {
        const userMessage = messageInput.value.trim();
        if (userMessage === '') return;

        if (!currentConversationId) {
            await createNewChat();
        }

        addMessage(userMessage, 'user');
        messageInput.value = '';
        adjustTextareaHeight(); // Сброс высоты после отправки

        try {
            const response = await fetch(`/api/conversations/${currentConversationId}/messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_message: userMessage })
            });

            if (!response.ok) throw new Error('Ошибка сервера');

            const data = await response.json();
            addMessage(data.response, 'assistant');

            const activeChatItem = document.querySelector('.chat-list-item.active');
            if (activeChatItem && activeChatItem.textContent === 'Новый чат') {
                activeChatItem.textContent = userMessage;
            }

        } catch (error) {
            console.error('Ошибка отправки:', error);
            addMessage('Произошла ошибка. Пожалуйста, попробуйте еще раз.', 'assistant');
        }
    }

    // Обработчики событий
    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { // Отправка по Enter, но не по Shift + Enter
            e.preventDefault(); // Предотвращаем стандартное поведение (перенос строки)
            sendMessage();
        }
    });
    newChatBtn.addEventListener('click', createNewChat);

    // Инициализация при загрузке страницы
    loadConversations();
});
    </script>
</body>
</html>
