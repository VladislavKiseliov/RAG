# docker-compose.infra.yml
services:
  redis:
    image: redis:7
    container_name: rag_redis
    ports:
      - "6379:6379"
    volumes:
      - ragprogramm_redis_data:/data
    restart: unless-stopped
    networks:
      - rag_network

  minio:
    image: minio/minio:latest
    container_name: rag_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - rag_network

volumes:
  ragprogramm_redis_data:
    external: true
  minio_data:

networks:
  rag_network:
    external: true
    name: rag_network