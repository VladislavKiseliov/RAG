5. Формулировка в виде прямого запроса к регламенту.

Твой ответ должен быть СТРОГО в формате валидного JSON-массива строк (без markdown-тегов ```json ... ``` и без текста вокруг).

Пример идеального ответа:
["настройка ШИМ на STM32F103", "STM32F103 PWM configuration datasheet", "как запустить таймер для ШИМ микроконтроллера", "регистры управления ШИМ STM32", "руководство по настройке таймеров STM32"]

SUMMARY:
{summary}

ПОСЛЕДНИЕ СООБЩЕНИЯ:
