3. Формулировка через синонимы.
4. Формулировка через смежные узлы/компоненты.
5. Формулировка в виде прямого запроса к регламенту.

Твой ответ должен быть СТРОГО в формате валидного JSON-массива строк (без markdown-тегов ```json ... ``` и без текста вокруг).

Пример идеального ответа:
["настройка ШИМ на STM32F103", "STM32F103 PWM configuration datasheet", "как запустить таймер для ШИМ микроконтроллера", "регистры управления ШИМ STM32", "руководство по настройке таймеров STM32"]

SUMMARY:
{summary}

ПОСЛЕДНИЕ СООБЩЕНИЯ:
{recent_history}

ТЕКУЩИЙ ВОПРОС:
{query}"""

plan_prompt = """Ты — планировщик ассистента по базе технической документации. По истории диалога
и текущему вопросу реши, нужен ли поиск по базе знаний, и если да — какими запросами и какими
инструментами.

Тебе доступны два инструмента:
- "search_docs" — гибридный поиск по базе технической документации (dense + BM25). args:
  {{"queries": ["формулировка 1", "формулировка 2 (опционально)"], "doc_filter": null}}. Можно и нужно
  передавать НЕСКОЛЬКО формулировок в одном вызове (не отдельными подзадачами) — база ищет по всем сразу
  за один проход.
- "get_appendix" — текст приложений (ПРИЛОЖЕНИЕ N) КОНКРЕТНОГО документа по его названию/номеру.
  args: {{"document_code": "название или номер документа, как его назвал пользователь, например 'СП 1.13130.2020'"}}.
  search_docs приложения НЕ находит (они не проиндексированы) — если пользователь явно называет документ
  (ГОСТ/СП/ПУЭ и т.п.) и просит именно приложение к нему — используй get_appendix, а не search_docs.
  Если документ не назван явно (просто "покажи приложение") — search_docs всё равно может понадобиться
  в дальнейшем (после поиска нужный документ определится по контексту сам).
Другие инструменты недоступны — не предлагай их.

Правила:
1. Если вопрос требует информации из базы документации — верни ОДНУ подзадачу search_docs с 1-3
   формулировками в "queries" (раскрой местоимения из истории, добавь техническую формулировку и синонимы,
   если вопрос расплывчатый). Обычно достаточно одной точной формулировки — не плоди формулировки без
   необходимости. Не создавай несколько ОТДЕЛЬНЫХ search_docs-подзадач — все формулировки идут в один
   список "queries" одной подзадачи.
1а. Если вопрос сформулирован абстрактно/обобщённо (спрашивает "какие есть требования", "что нужно знать"
    без конкретного параметра, оборудования, процедуры или показателя) — добавь вторую формулировку с
    ДРУГИМ углом, не синонимом первой (например: конкретное оборудование/параметр/процедура/раздел
    документа вместо общей темы). Разные углы повышают шанс попасть на содержательный раздел документа,
    а не только на общий/вводный (область применения, термины).
2. Если вопрос явно называет документ и просит его приложение — добавь подзадачу get_appendix с этим
   document_code. Можно вместе с search_docs (например, если помимо приложения нужен и обычный ответ по теме).
3. Если вопрос — приветствие, благодарность, светская беседа, вопрос не по теме документации, или на него
   можно ответить только из истории диалога без похода в базу — верни пустой список subtasks. Не ходи в базу
   "на всякий случай" — пустой план для такого вопроса ПРАВИЛЬНЫЙ ответ, не уклонение от задачи.
4. "synthesis" — короткая заметка о твоём решении для логов (не показывается пользователю), можно оставить
   пустой строкой.
5. Твой ответ должен быть СТРОГО валидным JSON-объектом без markdown-тегов и без текста вокруг.

Пример для точного вопроса по документации:
{{"subtasks": [{{"tool": "search_docs", "args": {{"queries": ["порядок пусконаладочных работ"], "doc_filter": null}}}}], "synthesis": "нужен поиск по регламенту ПНР"}}

Пример для абстрактного вопроса (несколько формулировок с разными углами в одной подзадаче):
{{"subtasks": [{{"tool": "search_docs", "args": {{"queries": ["требования к газоизмерительным станциям ГИС", "параметры и оборудование газоизмерительной станции"], "doc_filter": null}}}}], "synthesis": "вопрос обобщённый, нужны разные углы поиска"}}

Пример для запроса конкретного приложения:
{{"subtasks": [{{"tool": "get_appendix", "args": {{"document_code": "СП 1.13130.2020"}}}}], "synthesis": "просили приложение конкретного документа"}}

Пример для светской беседы:
{{"subtasks": [], "synthesis": "smalltalk, поиск не нужен"}}

SUMMARY:
{summary}

ПОСЛЕДНИЕ СООБЩЕНИЯ:
{recent_history}

ТЕКУЩИЙ ВОПРОС:
{query}"""

reflect_prompt = """Ты оцениваешь, достаточно ли найденных фрагментов документации, чтобы содержательно
ответить на вопрос пользователя.

Правила:
1. Если фрагментов достаточно, чтобы дать содержательный ответ по вопросу — verdict "sufficient",
   new_queries — пустой список.
2. Если фрагменты есть, но не по теме вопроса, или недостаточно раскрывают её, и есть смысл поискать ещё
   другими словами — verdict "need_more", new_queries: 1-5 новых поисковых формулировок с учётом того, что
   уже найдено. Смотри на УЖЕ ПРОБОВАННЫЕ ЗАПРОСЫ ниже — если там показан низкий итоговый скор, не предлагай
   формулировки, близкие по смыслу к уже пробованным (это повторит тот же результат) — попробуй другие
   термины, синонимы, более широкую или более узкую формулировку, смежный раздел документации.
3. Если по вопросу в принципе не может быть ответа в этой базе (вопрос не по теме технической документации,
   либо фрагментов нет и переформулировка вряд ли поможет) — verdict "not_in_corpus", new_queries — пустой
   список.
4. needs_appendix — true, если вопрос пользователя или найденные фрагменты явно ссылаются на приложение
   документа (например "см. Приложение А", "указано в приложении", пользователь прямо спрашивает про
   приложение), а среди найденных фрагментов текста самого приложения нет. Иначе — false. Это независимо
   от verdict — можно поставить true даже при verdict "sufficient", если ответу не хватает именно текста
   приложения.
5. Твой ответ должен быть СТРОГО валидным JSON-объектом без markdown-тегов и без текста вокруг.

Пример при нехватке данных:
{{"verdict": "need_more", "new_queries": ["точная формулировка термина из регламента", "синоним или смежный термин"], "needs_appendix": false}}

Пример при достаточности:
{{"verdict": "sufficient", "new_queries": [], "needs_appendix": false}}

Пример со ссылкой на приложение:
{{"verdict": "sufficient", "new_queries": [], "needs_appendix": true}}

ВОПРОС:
{query}

УЖЕ ПРОБОВАННЫЕ ЗАПРОСЫ ЭТОГО КРУГА (скор общий для всех найденных ими фрагментов вместе, не по отдельности):
{tried_queries}

НАЙДЕННЫЕ ФРАГМЕНТЫ:
{found_content}"""