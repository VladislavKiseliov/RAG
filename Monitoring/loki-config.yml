auth_enabled: false

server:
  http_listen_port: 3100

ingester:
  wal:
    dir: /loki/wal
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  chunk_idle_period: 5m
  chunk_retain_period: 30s

schema_config:
  configs:
    - from: 2020-10-15
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/boltdb-cache
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/compactor
  shared_store: filesystem

limits_config:
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  reject_old_samples: true
  reject_old_samples_max_age: 7d
  retention_period: 30d
  # Единственный small-instance инстанс без выделенного query-frontend — дефолтные
  # лимиты (рассчитаны на multi-tenant кластер) отдают "too many outstanding requests"
  # уже на нескольких дашборд-панелях с count_over_time (Loki шардирует каждую на
  # десятки под-запросов). Подняты с запасом под этот масштаб.
  max_query_parallelism: 32
  split_queries_by_interval: 1h

querier:
  max_concurrent: 16

frontend:
  max_outstanding_per_tenant: 4096

chunk_store_config:
  max_look_back_period: 30d

table_manager:
  retention_deletes_enabled: true
  retention_period: 30d