[project]
name = "rag-programm"
version = "0.1.0"
description = "RAG Chat Application"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "fastapi (>=0.121.3,<0.122.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "pwdlib (>=0.3.0,<0.4.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "qdrant-client (>=1.16.0,<2.0.0)",
    "sentence-transformers (>=5.1.2,<6.0.0)",
    "numpy (>=2.3.5,<3.0.0)",
    "langchain-core (>=1.1.0,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-google-genai (>=3.1.0,<4.0.0)",
    "langchain-huggingface (>=1.0.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"







[dependency-groups]
dev = [
    "alembic (>=1.17.2,<2.0.0)",
    "pytest (>=9.0.1,<10.0.0)"
]
