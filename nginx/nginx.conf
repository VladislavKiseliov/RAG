map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend_node {
    server rag_frontend:5173;
}

upstream admin_node {
    server rag_admin_panel:5174;
}

upstream backend_api {
    server rag_backend:8000;
}

upstream rag_service {
    server rag_service:8001;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 60M;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend_api;
    }

    location /auth/ {
        proxy_pass http://backend_api;
    }

    location /admin/ {
        proxy_pass http://backend_api;
    }

    location /documents/ {
        proxy_pass http://rag_service;
    }

    location / {
        proxy_pass http://frontend_node;


                # Отключаем ограничение буферизации для тяжелых/частых Dev-скриптов
        proxy_buffering off;

        # Увеличиваем таймауты, чтобы запросы не падали в Pending
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;



        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

    }
}

server {
    listen 81;
    server_name my-rag-project.ru localhost;

    port_in_redirect off;
    client_max_body_size 60M;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend_api;
    }

    location /auth/ {
        proxy_pass http://backend_api;
    }

    location /admin/ {
        proxy_pass http://backend_api;
    }

    location /documents/ {
        proxy_pass http://rag_service;
    }

    location / {
        proxy_pass http://admin_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}