map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 60M;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        set $backend http://rag_backend:8000;
        proxy_pass $backend;
    }

    location /auth/ {
        set $backend http://rag_backend:8000;
        proxy_pass $backend;
    }

    location /admin/ {
        set $backend http://rag_backend:8000;
        proxy_pass $backend;
    }

    location /documents/ {
        set $rag http://rag_service:8001;
        proxy_pass $rag;
    }

    location /rag-documents/ {
        set $minio http://minio:9000;
        proxy_pass $minio;
        client_max_body_size 100M;
    }

    location /messenger/ {
        set $backend http://rag_backend:8000;
        proxy_pass $backend;
    }

    location /websocket/ {
        set $backend http://rag_backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        set $frontend http://rag_frontend:5173;
        proxy_pass $frontend;

        proxy_buffering off;

        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Запрещаем Cloudflare кэшировать HTML — иначе браузер получает
        # старый index.html со ссылками на несуществующие хешированные assets
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
