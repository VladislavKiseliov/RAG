map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 60M;
    absolute_redirect off;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        set $backend http://rag_backend:8000;
        proxy_pass $backend;

        # Дефолт nginx (60s) короче, чем httpx-таймаут backend'а на LLM-ответ (90s,
        # llm_client.py) — при долгой генерации nginx рвал соединение раньше, чем
        # backend успевал ответить (клиент видел ошибку, хотя ответ сохранялся в БД).
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # SSE (/api/chats/{id}/messages/stream) — без этого nginx буферизует весь
        # ответ backend'а и отдаёт браузеру одним куском только в конце, стрим не виден.
        proxy_buffering off;
    }

    location /auth/ {
        set $backend http://rag_backend:8000;
        proxy_pass $backend;
    }

    # Точное совпадение "/admin" (без слэша) - это SPA-роут фронтенда (страница
    # админки, AppRail -> /admin), не backend API. У nginx exact-match location
    # (=) имеет наивысший приоритет и проверяется раньше префиксного /admin/ ниже -
    # без этого F5 на /admin улетал на backend API (там такого HTML-маршрута нет,
    # только под-пути вида /admin/documents) и показывал голый {"detail":"Not Found"}
    # вместо приложения. /admin/что-то (реальные вызовы API) по-прежнему уходит
    # в location /admin/ ниже, тут ничего не меняется.
    location = /admin {
        set $frontend http://rag_frontend:5173;
        proxy_pass $frontend;

        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /admin/ {
        set $backend http://rag_backend:8000;
        proxy_pass $backend;
    }

    location /documents/ {
        set $rag http://rag_service:8001;
        proxy_pass $rag;
    }

    location /rag-documents/ {
        set $minio http://minio:9000;
        proxy_pass $minio;
        client_max_body_size 100M;
        # Presigned PUT живёт 300с (generate_presigned_url в bucket_storage_provider.py) -
        # без явных таймаутов действуют дефолты nginx (60с), которых не хватает большим
        # файлам (десятки МБ) на небыстром канале - загрузка зависала в pending.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /knowledge-base/ {
        set $minio http://minio:9000;
        proxy_pass $minio;
        client_max_body_size 100M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /messenger/ {
        set $backend http://rag_backend:8000;
        proxy_pass $backend;
    }

    location /websocket/ {
        set $backend http://rag_backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        set $frontend http://rag_frontend:5173;
        proxy_pass $frontend;

        proxy_buffering off;

        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Запрещаем Cloudflare кэшировать HTML — иначе браузер получает
        # старый index.html со ссылками на несуществующие хешированные assets
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
